<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img"
  aria-labelledby="title description">
  <title id="title">Application overview</title>
  <desc id="description">A demo user uses Voice Freight Broker and signs in through Cloudflare Access. The application validates access tokens and uses OpenAI for voice, analysis and confirmation.</desc>
  <style>
    .boundary { fill: none; stroke: #ccc; }
    .node { fill: #f8f8f8; stroke: #226c8e; }
    .external { fill: #f8f8f8; stroke: #226c8e; }
    .line { fill: none; stroke: #226c8e; stroke-width: 1.25; }
    .arrow { fill: #226c8e; }
    .text { fill: #3b3b3b; font-family: system-ui, sans-serif; font-size: 14px; }
    .heading { font-size: 14px; }
    .name { font-size: 14px; }
    .detail { font-size: 14px; }
    .label { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .boundary { stroke: #343434; }
      .node, .external { fill: #202020; }
      .text { fill: #ccc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z" />
    </marker>
  </defs>

  <path class="line" d="M 450 100 V 190" marker-end="url(#arrow)" />
  <path class="line" d="M 330 65 H 168 Q 160 65 160 73 V 370" marker-end="url(#arrow)" />
  <path class="line" d="M 330 235 H 208 Q 200 235 200 243 V 370" marker-end="url(#arrow)" />
  <path class="line" d="M 570 235 H 732 Q 740 235 740 243 V 370" marker-end="url(#arrow)" />
  <text class="text label" x="465" y="150" text-anchor="start">Calls and reports</text>
  <text class="text label" x="24" y="148" text-anchor="start">Signs in with</text>
  <text class="text label" x="24" y="168" text-anchor="start">an email code</text>
  <text class="text label" x="210" y="310" text-anchor="start">Validates</text>
  <text class="text label" x="210" y="330" text-anchor="start">access tokens</text>
  <text class="text label" x="755" y="300" text-anchor="start">Voice and</text>
  <text class="text label" x="755" y="320" text-anchor="start">model APIs</text>
  <rect class="node" x="330" y="30" width="240" height="70" />
  <text class="text" x="450" y="58" text-anchor="middle">Demo user</text>
  <text class="text" x="450" y="82" text-anchor="middle">Plays a carrier and reviews calls</text>
  <rect class="node" x="330" y="190" width="240" height="90" />
  <text class="text" x="450" y="228" text-anchor="middle">Voice Freight Broker</text>
  <text class="text" x="450" y="252" text-anchor="middle">Simulates freight brokerage calls</text>
  <rect class="node" x="40" y="370" width="240" height="85" />
  <text class="text" x="160" y="405.5" text-anchor="middle">Cloudflare Access</text>
  <text class="text" x="160" y="429.5" text-anchor="middle">Authenticates invited users</text>
  <rect class="node" x="620" y="370" width="240" height="85" />
  <text class="text" x="740" y="405.5" text-anchor="middle">OpenAI</text>
  <text class="text" x="740" y="429.5" text-anchor="middle">Voice, analysis and confirmation</text>
</svg>

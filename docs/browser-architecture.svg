<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img"
  aria-labelledby="title description">
  <title id="title">Browser and app entry point</title>
  <desc id="description">A demo user interacts with the web application. Public assets and identity requests reach the App Worker directly; API requests pass through Cloudflare Access. The web application exchanges audio and transcripts with OpenAI GPT Live.</desc>
  <style>
    .boundary { fill: none; stroke: #ccc; }
    .node { fill: #f8f8f8; stroke: #226c8e; }
    .external { fill: #f8f8f8; stroke: #226c8e; }
    .line { fill: none; stroke: #226c8e; stroke-width: 1.25; }
    .arrow { fill: #226c8e; }
    .text { fill: #3b3b3b; font-family: system-ui, sans-serif; font-size: 14px; }
    .heading { font-size: 14px; }
    .name { font-size: 14px; }
    .detail { font-size: 14px; }
    .label { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .boundary { stroke: #343434; }
      .node, .external { fill: #202020; }
      .text { fill: #ccc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z" />
    </marker>
  </defs>

  <path class="line" d="M 485 90 V 170" marker-end="url(#arrow)" />
  <path class="line" d="M 485 265 V 400" marker-end="url(#arrow)" />
  <path class="line" d="M 365 220 H 158 Q 150 220 150 228 V 315" marker-end="url(#arrow)" />
  <path class="line" d="M 150 385 V 432 Q 150 440 158 440 H 365" marker-end="url(#arrow)" />
  <path class="line" d="M 605 215 H 842 Q 850 215 850 223 V 315" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text class="text label" x="500" y="135" text-anchor="start">Uses</text>
  <text class="text label" x="500" y="330" text-anchor="start">Assets and identity</text>
  <text class="text label" x="500" y="350" text-anchor="start">/ HTTPS</text>
  <text class="text label" x="163" y="250" text-anchor="start">API requests</text>
  <text class="text label" x="163" y="270" text-anchor="start">/ HTTPS</text>
  <text class="text label" x="865" y="250" text-anchor="start">Audio and</text>
  <text class="text label" x="865" y="270" text-anchor="start">transcript /</text>
  <text class="text label" x="865" y="290" text-anchor="start">WebRTC</text>
  <rect class="node" x="365" y="30" width="240" height="60" />
  <text class="text" x="485" y="65" text-anchor="middle">Demo user</text>
  <rect class="node" x="365" y="170" width="240" height="95" />
  <text class="text" x="485" y="198.5" text-anchor="middle">Web application</text>
  <text class="text" x="485" y="222.5" text-anchor="middle">[React]</text>
  <text class="text" x="485" y="246.5" text-anchor="middle">Call and dashboard UI</text>
  <rect class="node" x="40" y="315" width="220" height="70" />
  <text class="text" x="150" y="355" text-anchor="middle">Cloudflare Access</text>
  <rect class="node" x="740" y="315" width="220" height="70" />
  <text class="text" x="850" y="355" text-anchor="middle">OpenAI GPT Live</text>
  <rect class="node" x="365" y="400" width="240" height="95" />
  <text class="text" x="485" y="428.5" text-anchor="middle">App Worker</text>
  <text class="text" x="485" y="452.5" text-anchor="middle">[Cloudflare Worker]</text>
  <text class="text" x="485" y="476.5" text-anchor="middle">Assets and request routing</text>
</svg>
